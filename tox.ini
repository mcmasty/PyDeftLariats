[tox]
env_list = py311, py312, py313, ruff
skip_missing_interpreters = true

; Legacy travis section removed (not used with tox 4)

[testenv:ruff]
basepython = python
deps = ruff
commands = ruff check src tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}

commands = python -m unittest discover
