[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PyDeftLariats"
version = "2.0.0"
description = "Using PyHamcrest to build a collection of data filters."
readme = "README.md"
license = { text = "GNU General Public License v3" }
authors = [
    { name = "Tyler McMaster", email = "mcmasty@yahoo.com" }
]
keywords = ["hamcrest", "matchers", "data", "filters"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "click~=8.2.1",
    "PyHamcrest~=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pip==25.1.1",
    "bump-my-version~=1.2.4",
    "wheel==0.37.1",
    "watchdog==2.1.9",
    "tox==4.26.0",
    "coverage==7.8.2",
    "Sphinx==8.2.3",
    "alabaster>=1.0.0",
    "twine==6.1.0",
    "sphinxcontrib-mermaid==1.0.0",
    "ruff==0.11.11",
    "myst_parser==4.0.1",
    "pyrefly>=1.1.1",
]

[project.scripts]
deft = "deftlariat.scripts.cli:deft_cli"

[project.urls]
Homepage = "https://github.com/mcmasty/PyDeftLariats"

[tool.hatch.build.targets.wheel]
packages = ["src/deftlariat"]

[tool.ruff]
# Exclude the same directories as in your flake8 config
exclude = ["docs"]
# Line length - you can adjust this based on your preference
line-length = 127

[tool.ruff.lint]
# Enable pragmatic ruleset
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
# Allow autofix for all enabled rules (when using `ruff --fix`)
fixable = ["ALL"]
# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F403", "F405"]  # tests use hamcrest star imports intentionally

[tool.pyrefly]
# Pyrefly configuration (Rust-based type checker - faster than pyright/mypy)
# Note: Pyrefly is configured via command-line flags in CI
